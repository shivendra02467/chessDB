<!doctype html>
<title>Stockfish WASM Console</title>

<!-- ❶  Bring in the engine that was generated by Emscripten -->
<script src="./stockfish.js"></script>

<!-- ❷  Very small UI -->
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    font: 14px/1.4 monospace;
    background: #111;
    color: #0f0
  }

  #log {
    flex: 1;
    overflow: auto;
    white-space: pre-wrap;
    padding: 8px
  }

  #cmd {
    border: none;
    border-top: 1px solid #444;
    background: #222;
    color: #fff;
    padding: 6px;
    width: 100%;
    box-sizing: border-box
  }
</style>

<div id="log"></div>
<input id="cmd" placeholder="type UCI command & hit Enter">

<script>
  const log = document.getElementById('log');
  const cmd = document.getElementById('cmd');

  /** Append a line to the on‑page log */
  const append = line => {
    log.textContent += line + '\n';
    log.scrollTop = log.scrollHeight;          // auto‑scroll
  };

  /* ❸  Spin up the engine */
  window.Stockfish().then(sf => {
    window.sf = sf;                            // keep a global handle for devtools
    sf.addMessageListener(line => append('[SF] ' + line.trim()));

    // Minimal handshake
    sf.postMessage('uci');
    sf.postMessage('isready');
  });

  /* ❹  Send whatever the user types */
  cmd.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const txt = cmd.value.trim();
      if (!txt) return;
      append('> ' + txt);
      window.sf?.postMessage(txt);             // forward to engine
      cmd.value = '';
    }
  });
</script>
